name: arr-stack

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/qbittorrent:/config
      - ${DATA_ROOT:-./arr-stack/data}:/data
    ports:
      - ${QBIT_WEBUI_PORT:-8089}:8080
      - ${QBIT_TORRENT_PORT:-6881}:6881
      - ${QBIT_TORRENT_PORT:-6881}:6881/udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Etc/UTC}
    ports:
      - ${FLARESOLVERR_PORT:-8191}:8191
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/radarr:/config
      - ${DATA_ROOT:-./arr-stack/data}:/data
    ports:
      - ${RADARR_PORT:-7878}:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/sonarr:/config
      - ${DATA_ROOT:-./arr-stack/data}:/data
    ports:
      - ${SONARR_PORT:-8989}:8989
    restart: unless-stopped

  seerr:
    image: null-seerr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: null-seerr
    init: true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    ports:
      - ${NULL_SEERR_PORT:-5055}:5055
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/overseerr:/app/config
    restart: unless-stopped

  suggestarr:
    image: ciuse99/suggestarr:latest
    container_name: suggestarr
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/suggestarr:/app/config/config_files
    ports:
      - ${SUGGESTARR_PORT:-4455}:5000
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - VERSION=docker
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/plex:/config
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
    ports:
      - ${PLEX_PORT:-32400}:32400
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/jellyfin:/config
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
    ports:
      - ${JELLYFIN_PORT:-8096}:8096
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/bazarr:/config
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
    ports:
      - ${BAZARR_PORT:-6767}:6767
    restart: unless-stopped

  shoko:
    image: ghcr.io/shokoanime/server:latest
    container_name: shoko
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/shoko:/home/shoko/.shoko
      - ${TV_DIR:-./arr-stack/data/media/tv}:/data/media/anime
    ports:
      - ${SHOKO_PORT:-8111}:8111
    restart: unless-stopped

  tdarr:
    image: haveagitgat/tdarr:latest
    container_name: tdarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/server:/app/server
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/configs:/app/configs
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/logs:/app/logs
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
      - ${TRANSCODE_CACHE:-./arr-stack/data/transcode_cache}:/temp
    ports:
      - ${TDARR_WEB_PORT:-8265}:8265
      - ${TDARR_SERVER_PORT:-8266}:8266
    restart: unless-stopped

  tdarr-node:
    image: haveagitgat/tdarr_node:latest
    container_name: tdarr-node
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - nodeID=StableNode
      - serverIP=tdarr
      - serverPort=8266
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/configs:/app/configs
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/logs:/app/logs
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
      - ${TRANSCODE_CACHE:-./arr-stack/data/transcode_cache}:/temp
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiYjU0MjRkOWI3MzY2Mzg0NTIwMTVjYTM2YjU0MjZjZDUiLCJ0IjoiY2IyYjBlZjktYmI4OC00ZjAwLWFjN2QtNzVjMzIzZDFlMWI1IiwicyI6Ik0yWTROakU0WVRJdE1HVTNNaTAwWkRoaUxUaG1ORGt0WkRNd09UVTNZVFpsTVdJMSJ9}
    restart: unless-stopped

  nullseerr-init:
    image: python:3.11-alpine
    container_name: nullseerr-init
    depends_on:
      - seerr
      - radarr
      - sonarr
      - prowlarr
      - qbittorrent
      - jellyfin
      - plex
      - bazarr
      - shoko
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}:/config
      - ${DATA_ROOT:-./arr-stack/data}:/data
      - ./scripts/wire_stack.py:/app/wire_stack.py:ro
      - ./templates:/templates:ro
    environment:
      - RUNNING_IN_DOCKER=true
      - STACK_ROOT=/app
    working_dir: /app
    entrypoint: ["sh", "-c", "pip install pyyaml requests bcrypt >/dev/null 2>&1 && python -u /app/wire_stack.py"]
    restart: "no"

