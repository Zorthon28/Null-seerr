name: arr-stack

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.4
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/qbittorrent:/config
      - ${DATA_ROOT:-./arr-stack/data}:/data
    ports:
      - ${QBIT_WEBUI_PORT:-8089}:8080
      - ${QBIT_TORRENT_PORT:-6881}:6881
      - ${QBIT_TORRENT_PORT:-6881}:6881/udp
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.31.2
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Etc/UTC}
    ports:
      - ${FLARESOLVERR_PORT:-8191}:8191
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8191/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:5.19.3
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/radarr:/config
      - ${DATA_ROOT:-./arr-stack/data}:/data
    ports:
      - ${RADARR_PORT:-7878}:7878
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.13.2934
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/sonarr:/config
      - ${DATA_ROOT:-./arr-stack/data}:/data
    ports:
      - ${SONARR_PORT:-8989}:8989
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  seerr:
    image: null-seerr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: null-seerr
    init: true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    ports:
      - ${NULL_SEERR_PORT:-5055}:5055
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/overseerr:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.10.6
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/jellyfin:/config
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
    ports:
      - ${JELLYFIN_PORT:-8096}:8096
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.1
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/bazarr:/config
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
    ports:
      - ${BAZARR_PORT:-6767}:6767
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6767/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ==========================================
  # Optional Services (Activated via Profiles)
  # ==========================================

  suggestarr:
    image: ciuse99/suggestarr:v2.1.0
    container_name: suggestarr
    profiles: ["suggestarr", "ai", "all", "extended"]
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/suggestarr:/app/config/config_files
    ports:
      - ${SUGGESTARR_PORT:-4455}:5000
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:1.41.4
    container_name: plex
    profiles: ["plex", "all", "extended"]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - VERSION=docker
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/plex:/config
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
    ports:
      - ${PLEX_PORT:-32400}:32400
    restart: unless-stopped

  shoko:
    image: ghcr.io/shokoanime/server:4.2.2
    container_name: shoko
    profiles: ["shoko", "anime", "all", "extended"]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/shoko:/home/shoko/.shoko
      - ${TV_DIR:-./arr-stack/data/media/tv}:/data/media/anime
    ports:
      - ${SHOKO_PORT:-8111}:8111
    restart: unless-stopped

  tdarr:
    image: haveagitgat/tdarr:2.35.01
    container_name: tdarr
    profiles: ["tdarr", "all", "extended"]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/server:/app/server
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/configs:/app/configs
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/logs:/app/logs
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
      - ${TRANSCODE_CACHE:-./arr-stack/data/transcode_cache}:/temp
    ports:
      - ${TDARR_WEB_PORT:-8265}:8265
      - ${TDARR_SERVER_PORT:-8266}:8266
    restart: unless-stopped

  tdarr-node:
    image: haveagitgat/tdarr_node:2.35.01
    container_name: tdarr-node
    profiles: ["tdarr", "all", "extended"]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - nodeID=StableNode
      - serverIP=tdarr
      - serverPort=8266
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/configs:/app/configs
      - ${CONFIG_ROOT:-./arr-stack/config}/tdarr/logs:/app/logs
      - ${MEDIA_ROOT:-./arr-stack/data/media}:/data/media
      - ${TRANSCODE_CACHE:-./arr-stack/data/transcode_cache}:/temp
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    container_name: cloudflared
    profiles: ["cloudflared", "tunnel", "all", "extended"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Set your Cloudflare Tunnel token via CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

  nullseerr-init:
    image: python:3.11-alpine
    container_name: nullseerr-init
    depends_on:
      seerr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      jellyfin:
        condition: service_healthy
      bazarr:
        condition: service_healthy
    volumes:
      - ${CONFIG_ROOT:-./arr-stack/config}:/config
      - ${DATA_ROOT:-./arr-stack/data}:/data
      - ./scripts/wire_stack.py:/app/wire_stack.py:ro
      - ./templates:/templates:ro
    environment:
      - RUNNING_IN_DOCKER=true
      - STACK_ROOT=/app
    working_dir: /app
    entrypoint: ["sh", "-c", "pip install pyyaml requests bcrypt >/dev/null 2>&1 && python -u /app/wire_stack.py"]
    restart: on-failure:5
